<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>mania-web — osu!mania WebGL Replay Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── main stage fills viewport ── */
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#000}
#game{width:100%;height:100%;object-fit:contain}
#hud{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
body.noinfo #info{display:none}
#info{position:absolute;top:8px;left:8px;font-size:10px;color:#aaa;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:3px;z-index:5}

/* ── bottom drawer: hidden until the pointer approaches the bottom edge ── */
#drawer{position:fixed;bottom:0;left:0;right:0;z-index:100;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  background:rgba(18,18,26,.97);backdrop-filter:blur(8px);border-top:1px solid #2a2a3a;
  max-height:70vh;overflow-y:auto;padding:14px 16px 18px}
#drawer.open{transform:translateY(0)}
/* the invisible hot strip that summons the drawer */
#hotzone{position:fixed;left:0;right:0;bottom:0;height:18px;z-index:99}

#drawer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#drawer label{font-size:10px;color:#666;display:flex;flex-direction:column;gap:3px;min-width:0}
#drawer input[type=file]{font-size:10px;max-width:150px}
#drawer input[type=text],#drawer input[type=number]{padding:5px 8px;border-radius:4px;background:#1a1a28;color:#e0e0e8;border:1px solid #2a2a3a;font-size:11px;width:110px}
#drawer input[type=range]{width:100%;max-width:640px}
#drawer .sep{width:100%;height:1px;background:#2a2a3a;margin:0 0 10px}
#drawer .time{font-size:13px;color:#ccc;font-variant-numeric:tabular-nums;min-width:96px}
#drawer .hint{font-size:10px;color:#555}
button{padding:6px 14px;border:0;border-radius:5px;background:#6c5ce7;color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.4;cursor:wait}
button.secondary{background:#2a2a3a}
button.playing{background:#e74c3c}
select{padding:4px 6px;border-radius:4px;background:#1a1a28;color:#e0e0e8;border:1px solid #2a2a3a;font-size:11px}
#vol{width:60px}
#bgDimVal,#bgBlurVal{color:#888;min-width:28px;font-size:10px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1920" height="1080"></canvas>
  <canvas id="hud" width="1920" height="1080"></canvas>
  <div id="info">鼠标移到屏幕底部打开控制面板 · 上传 .osr 或输入谱面 ID 开始</div>
</div>

<!-- hovering this strip pulls the drawer out; everything except the playfield lives in it -->
<div id="hotzone"></div>

<div id="drawer">
  <div class="row">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="btnPlay" disabled>▶ 播放</button>
    <button id="btnReset" class="secondary" disabled>⏮ 重置</button>
    <span class="hint">空格 播放/暂停 · 鼠标离开面板自动收起</span>
    <button id="btnFull" class="secondary" style="margin-left:auto">⛶ 全屏</button>
  </div>

  <div class="row">
    <label style="flex:1;min-width:240px">歌曲进度 <input type="range" id="seek" min="0" max="10000" value="0"/></label>
  </div>
  <div class="sep"></div>

  <div class="row">
    <label>谱面 ID <input type="text" id="bidInput" placeholder="如 5125772"/></label>
    <label>回放 .osr <input type="file" id="fOsr" accept=".osr"/>
      <button type="button" id="btnClearOsr" class="secondary" style="padding:3px 8px;font-size:10px;margin-top:2px">取消选择</button>
    </label>
    <button id="btnLoad">加载</button>
  </div>
  <div class="sep"></div>

  <div class="row">
    <label>皮肤 <select id="skinSel"><option value="">加载中…</option></select></label>
    <label>.osk <input type="file" id="fOsk" accept=".osk,.zip"/></label>
  </div>
  <div class="sep"></div>

  <div class="row">
    <label>滚动速度 <input type="number" id="scrollSpeed" value="30" min="1" max="40" step="0.5" style="width:55px"/></label>
    <label>播放速度 <select id="playSpeed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <label>背景暗度 <input type="range" id="bgDim" min="0" max="100" value="30" style="width:80px"/> <span id="bgDimVal">30%</span></label>
    <label>模糊 <input type="range" id="bgBlur" min="0" max="20" value="0" style="width:80px"/> <span id="bgBlurVal">0</span></label>
  </div>
  <div class="sep"></div>

  <div class="row">
    <canvas id="volCircle" width="56" height="56" style="cursor:pointer"></canvas>
    <span style="font-size:10px;color:#666">音量</span>
    <button id="btnExport" class="secondary" disabled style="margin-left:auto">导出</button>
  </div>
</div>
<audio id="audio"></audio>
<script type="module" src="src/main.js"></script>
</body>
</html>
