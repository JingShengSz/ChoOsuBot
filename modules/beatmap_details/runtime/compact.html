.msd{height:319px}.msd-head{display:flex;justify-content:space-between;align-items:center}.msd-head .hint{font-size:13px;color:#95a8bf}.msd-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:15px;row-gap:10px}.skill{display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:8px;font-size:14px;color:#b8c8da}.skill .rail{height:7px;border-radius:6px;background:#2d3d56;overflow:hidden}.skill .rail b{display:block;height:100%;background:linear-gradient(90deg,#746ffc,#b8acff)}.skill strong{text-align:right;color:#c0baff;font-size:16px}.msd-overall{margin-top:17px;border-top:1px solid #30415a;padding-top:12px;display:flex;justify-content:space-between;color:#aabed2;font-size:14px}.msd-overall b{color:#bbb2ff;font-size:20px}

</style><link rel="stylesheet" href="../../assets/detail_green.css"></head><body>
<div id="card"><img class="character" src="../../assets/characters/detail_green.png" alt="镜像立绘，指向估算难度图案"><header class="head"><div><div class="over">OSU!MANIA　/　BEATMAP DETAIL　/　COMPACT</div><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div><div class="id" id="map-id"></div></header>
<div class="columns"><div class="left">
<div class="estimate-display" id="estimate-display"><div class="estimate-icon-wrap" id="estimate-icon-wrap"></div><div class="estimate-copy"><div class="estimate-eyebrow" id="estimate-eyebrow"></div><div class="estimate-name" id="estimate-name"></div><div class="estimate-number" id="estimate-number"></div></div></div>
<section class="panel density"><h2>音符密度 / DENSITY</h2><div class="chartbox"><div class="chart-head"><b id="segment-label"></b><span id="density-stats"></span></div><svg id="density-chart"></svg><div class="chart-foot"><span id="first-time"></span><span id="last-time"></span></div></div></section>
</div><div class="right">
<section class="panel msd"><div class="msd-head"><h2>MinaCalc / MSD</h2><span class="hint" id="msd-version"></span></div><div class="msd-grid" id="skills"></div><div class="msd-overall"><span id="msd-meta"></span><span>Overall <b id="overall"></b></span></div></section>
<section class="panel sunny"><h2>SUNNY · 估算星数</h2><div class="sunny-body"><strong id="sunny-star"></strong><span id="sunny-diff"></span></div></section>
<section class="panel pattern"><h2>键型 / PATTERNS</h2><div class="pattern-grid"><div><div class="kind" id="category"></div><div class="mode" id="mode"></div></div><div class="top-patterns" id="top-patterns"></div></div></section>
</div></div></div>
<script src="data.js"></script><script src="../../assets/dan_icons/icon_manifest.js"></script><script>
const d=window.BEATMAP_DETAILS, s=d.algorithms.Sunny, mixed=d.algorithms.Mixed, c=d.companella, m=d.metadata;
const f=(x,n=2)=>x==null?'—':Number(x).toFixed(n);
const clock=ms=>{const cs=Math.round(Number(ms)/10);return `${Math.floor(cs/6000).toString().padStart(2,'0')}:${Math.floor(cs%6000/100).toString().padStart(2,'0')}.${(cs%100).toString().padStart(2,'0')}`};
document.getElementById('title').textContent=m.Title;
document.getElementById('subtitle').textContent=`${m.ArtistUnicode} / ${m.Artist}　·　${m.Version}　·　mapped by ${m.Creator}`;
document.getElementById('map-id').innerHTML=`#${d.beatmapId}<small>SET #${m.BeatmapSetID}</small>`;
const primaryDiff=String(s.rework.estDiff||'—').split(' || ')[0];
const vibro=d.vibroDetection;
const vibroEvidence=vibro?.msdVibro
  ? `JackSpeed / Overall ${f(vibro.jackSpeedOverallRatio*100,1)}%`
  : `仅名称含 Vibro · MSD ${f(vibro?.jackSpeedOverallRatio*100,1)}% 未达 95%`;
const estimate=vibro?.isVibroMap
  ? {label:`${String(vibro.estimator||'ROXY').toUpperCase()} · 谱面类型`,name:'VIBRO',number:vibroEvidence,icon:'question'}
  : {label:`MIXED → ${mixed.actualEstimatorAlgorithm.toUpperCase()} · 推荐估算`,name:String(mixed.rework.estDiff||'—').split(' || ')[0],number:`数值难度 ${f(mixed.rework.numericDifficulty)}`};
function rankIconKey(name){
  const base=name.replace(/\s+(?:mid\/high|mid\/low|high|mid|low)$/i,'').trim();
  if(/^Reform (?:[1-9]|10)$/i.test(base))return `reform${base.match(/\d+$/)[0]}`;
  if(/^Thaumiel Eta$/i.test(base))return 'eta';
  if(/^Emik Zeta$/i.test(base))return 'zeta';
  if(/^CloverWisp Theta$/i.test(base))return 'theta';
  if(/^(?:Hypersovae|Lnlism) LN (\d+)$/i.test(base))return `ln${base.match(/\d+$/)[0]}`;
  if(/^LN \d+$/i.test(base))return `ln${base.match(/\d+$/)[0]}`;
  if(/^[a-z]+$/i.test(base))return base.toLowerCase();
  return null;
}
function iconSvg(key,cssClass){
  const box=window.DAN_ICON_BOUNDS?.[key];if(!box)return '';
  const [x1,y1,x2,y2]=box,pad=Math.max(x2-x1,y2-y1)*.035;
  return `<svg class="${cssClass}" viewBox="${x1-pad} ${y1-pad} ${x2-x1+2*pad} ${y2-y1+2*pad}" role="img" aria-label="${key}"><image href="../../assets/dan_icons/${key}.webp" width="1920" height="1080"/></svg>`;
}
const display=document.getElementById('estimate-display');
if(estimate.name==='VIBRO')display.classList.add('vibro');
const iconKey=estimate.icon||rankIconKey(estimate.name);
const artKey=window.DAN_ICON_BOUNDS?.[iconKey]?iconKey:'question';
const suffix=estimate.name.match(/\s+(mid\/high|mid\/low|high|low)$/i)?.[1].toLowerCase();
const suffixKey=suffix?.includes('high')?'plus':suffix?.includes('low')?'minus':null;
document.getElementById('estimate-icon-wrap').innerHTML=iconSvg(artKey,'estimate-icon')+(suffixKey?iconSvg(suffixKey,'estimate-suffix'):'');
document.getElementById('estimate-eyebrow').textContent=estimate.label;
document.getElementById('estimate-name').textContent=estimate.name;
document.getElementById('estimate-number').textContent=estimate.number;
document.getElementById('sunny-star').textContent=`${f(s.rework.star,3)}★`;
document.getElementById('sunny-diff').textContent=vibro?.isVibroMap?'Vibro 类型 · 段位未判定':primaryDiff;
const density=d.density.counts, svg=document.getElementById('density-chart');
const firstMs=d.density.firstMs,lastMs=d.density.lastMs;
const segments=d.patternSegments?.segments||[];
document.getElementById('segment-label').textContent=segments.length?`每 ${d.patternSegments.seconds} 秒键型 · 下方为音符密度`:'音符密度';
const colorFor=label=>/Roll/i.test(label)?'#ffb454':/Handstream/i.test(label)?'#a69cff':/Jumptrill/i.test(label)?'#f386bb':/Jumpstream/i.test(label)?'#62d9ff':/Jack/i.test(label)?'#ffd280':'#8ee0b5';
const shortName=label=>label==='Jumpstream Tech'?'JS Tech':label;
const runs=[];for(const segment of segments){const last=runs.at(-1);if(last&&last.category===segment.category)last.endMs=segment.endMs;else runs.push({...segment})}
function renderDensityChart(){
  // The SVG coordinate system follows its actual CSS size. A fixed viewBox with
  // preserveAspectRatio="none" stretches labels when the panel is resized.
  const W=Math.round(svg.getBoundingClientRect().width),H=Math.round(svg.getBoundingClientRect().height);
  if(!W||!H||!density.length)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const L=42,R=10,T=65,B=26,chartW=W-L-R,chartH=H-T-B;
  const max=Math.max(10,Math.ceil(d.density.peak/10)*10);
  const Xms=ms=>L+Math.max(0,Math.min(1,(ms-firstMs)/(lastMs-firstMs)))*chartW;
  const X=i=>Xms(firstMs+i*1000),Y=v=>T+chartH-v/max*chartH;
  let grid='';for(let j=0;j<=3;j++){const v=max*j/3,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#2b4159"/><text x="${L-9}" y="${y+4}" text-anchor="end" fill="#8fa6bf" font-size="12">${Math.round(v)}</text>`}
  const path=density.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('')+` L${W-R},${Y(density.at(-1))}`;
  const windowLines=segments.slice(1).map(segment=>`<line x1="${Xms(segment.startMs)}" x2="${Xms(segment.startMs)}" y1="45" y2="${T+chartH}" stroke="#9ab1c9" stroke-opacity=".28" stroke-dasharray="3 5"/>`).join('');
  const patternBand=runs.map(run=>{
    const x1=Xms(run.startMs),x2=Xms(run.endMs),width=x2-x1,color=colorFor(run.category);
    const name=shortName(run.category);
    const compact=name.replace(/Jumpstream/g,'JS').replace(/Handstream/g,'HS').replace(/Jumptrill/g,'JT').replace(/Coordination/g,'Coord.').replace(/Uncategorised/g,'Other').replace(/Minijacks/g,'MJ').replace(/Jacky WC/g,'WC').replace(/Wildcard/g,'WC').replace(/Density/g,'Dens.');
    const words=width<100?compact.split(' '):[name];
    const label=words.map((word,index)=>`<tspan x="${(x1+x2)/2}" y="${words.length===1?30:20+13*index}">${word}</tspan>`).join('');
    return `<g><title>${run.category} · ${clock(run.startMs)}–${clock(run.endMs)}</title><rect x="${x1+2}" y="7" width="${Math.max(1,width-4)}" height="38" rx="6" fill="${color}" fill-opacity=".22" stroke="${color}" stroke-opacity=".75"/><text text-anchor="middle" fill="${color}" font-size="10" font-weight="700">${label}</text></g>`;
  }).join('');
  svg.innerHTML=`${grid}${windowLines}<path d="${path} L${W-R},${T+chartH} L${L},${T+chartH} Z" fill="#b9e790" opacity=".17"/><path d="${path}" fill="none" stroke="#b9e790" stroke-width="3" stroke-linejoin="round"/>${patternBand}`;
}
renderDensityChart();
new ResizeObserver(renderDensityChart).observe(svg);
document.getElementById('density-stats').textContent=`平均 ${f(d.density.mean)} NPS　·　峰值 ${d.density.peak} NPS`;
document.getElementById('first-time').textContent=`首物件 ${clock(d.objectStats.firstStartMs)}`;
document.getElementById('last-time').textContent=`末物件 ${clock(d.objectStats.lastStartMs)}`;
const skills=['Stream','Jumpstream','Handstream','Stamina','JackSpeed','Chordjack','Technical'];
const skillMax=Math.max(25,...Object.values(d.ettResult.values));
document.getElementById('skills').innerHTML=skills.map(k=>`<div class="skill"><span>${k}</span><div class="rail"><b style="width:${Math.min(100,d.ettResult.values[k]/skillMax*100)}%"></b></div><strong>${f(d.ettResult.values[k])}</strong></div>`).join('');
document.getElementById('overall').textContent=f(d.ettResult.values.Overall);
document.getElementById('msd-version').textContent=`${d.ettResult.etternaVersion||'—'} · scoreGoal 0.93`;
document.getElementById('msd-meta').textContent=`${d.ettResult.keycount}K · ${d.ettResult.rowCount.toLocaleString()} rows · ${d.ettResult.engine}`;
document.getElementById('category').textContent=d.patternReport.Category;
document.getElementById('mode').textContent=`Mode ${d.patternReport.ModeTag} · ${d.patternReport.Clusters.length} 键型簇 · HB row ${f(d.patternReport.HBRowRatio*100,1)}%`;
document.getElementById('top-patterns').innerHTML='<b>主要簇</b><br>'+d.patternReport.Clusters.slice(0,3).map(x=>x.Pattern).join(' · ');
</script><script src="../../assets/detail_ranks.js"></script></body></html>
