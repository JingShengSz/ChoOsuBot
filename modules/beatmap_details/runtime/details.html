<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>谱面详情 · Detail Pro</title>
<style>
@font-face{font-family:InterLocal;src:local('Segoe UI') format('truetype')}
:root{--bg:#0b101b;--panel:#131c2b;--panel2:#182438;--edge:#29384d;--text:#ecf4ff;--muted:#9baec5;--blue:#66d7ff;--pink:#ff7eb5;--purple:#a899ff;--gold:#ffcd74;--green:#86e5c5}
*{box-sizing:border-box}body{margin:0;background:#050912;color:var(--text);font-family:InterLocal,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.4;font-variant-numeric:tabular-nums}
.page{width:1500px;min-height:2000px;margin:28px auto;padding:60px 66px 64px;background:radial-gradient(circle at 84% 4%,#203358 0,transparent 34%),linear-gradient(145deg,#101828,#0a111d 72%);position:relative;overflow:hidden;box-shadow:0 18px 60px #0008}
.page:before{content:'';position:absolute;left:0;top:0;width:100%;height:7px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink))}
.eyebrow{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);font-weight:700}.pagehead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:34px}.pagehead h1{font-size:47px;line-height:1.12;margin:13px 0 9px;letter-spacing:-.04em}.sub{font-size:23px;color:var(--muted)}.serial{border:1px solid #5ca6d0;background:#152940;border-radius:16px;padding:15px 20px;color:var(--blue);font-size:18px;font-weight:700;white-space:nowrap}.lead{color:#b8c9db;font-size:17px;max-width:1080px;margin:0 0 24px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:20px 0 28px}.kpi{border:1px solid var(--edge);background:#142033e8;border-radius:16px;padding:17px 20px}.kpi .label{font-size:14px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}.kpi strong{display:block;font-size:32px;margin-top:5px;color:var(--text);letter-spacing:-.03em}.kpi strong.accent{color:var(--blue)}
.section{margin-top:22px;background:linear-gradient(155deg,#152034ed,#111b2bed);border:1px solid var(--edge);border-radius:19px;padding:24px 27px}.section h2{font-size:23px;margin:0 0 18px;display:flex;align-items:center;gap:12px}.section h2:before{content:'';height:22px;width:5px;border-radius:3px;background:var(--blue)}.section .note{color:var(--muted);font-size:14px;margin:13px 0 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #263447}.row:last-child{border-bottom:0}.row .key{color:var(--muted);font-size:15px}.row .val{font-size:16px;text-align:right;max-width:68%;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:14px;color:#c7d9ed;border:1px solid #344860;background:#1b2a40;padding:7px 10px;border-radius:999px}.chip.on{color:#91e9d1;border-color:#356b62;background:#173a37}.chip.off{color:#91a5bf}
.chartwrap{border:1px solid #293b51;background:#0d1929;border-radius:14px;padding:17px 16px 11px}.charttitle{display:flex;justify-content:space-between;margin-bottom:8px;align-items:baseline}.charttitle strong{font-size:18px}.charttitle span{font-size:14px;color:var(--muted)}svg.chart{display:block;width:100%;height:210px}svg.chart.tall{height:245px}.axis-note{color:var(--muted);font-size:13px;margin-top:6px}.legend{display:flex;gap:20px;font-size:14px;color:#c9d9ec;margin:8px 0 0}.legend i{width:18px;height:3px;display:inline-block;vertical-align:middle;margin-right:7px}
table{border-collapse:collapse;width:100%;font-size:16px}th{text-align:left;color:#9bb1c9;font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:10px 12px;background:#1c2b40}td{padding:11px 12px;border-bottom:1px solid #2a3a50;vertical-align:top}tr:last-child td{border-bottom:0}.numeric{text-align:right;font-variant-numeric:tabular-nums}.highlight{color:var(--blue);font-weight:700}.warn{color:var(--gold)}.pink{color:var(--pink)}.green{color:var(--green)}.muted{color:var(--muted)}.tiny{font-size:13px}.small{font-size:14px}.tagline{display:flex;flex-wrap:wrap;gap:6px}.tagline span{font-size:13px;padding:5px 8px;border-radius:6px;background:#243249;color:#bed0e3}.flex{display:flex;gap:18px}.flex>*{flex:1}.metric{font-size:41px;font-weight:750;line-height:1.15;letter-spacing:-.035em}.metric-label{font-size:14px;color:var(--muted);margin-top:5px}.foot{font-size:13px;color:#7990aa;border-top:1px solid #304057;margin-top:24px;padding-top:15px;display:flex;justify-content:space-between;gap:20px}.spaced{margin-top:16px}.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.barcard{background:#1a2940;border:1px solid #30475f;border-radius:12px;padding:14px}.barcard .n{font-size:24px;font-weight:700;color:var(--purple)}.barcard .lbl{font-size:13px;color:var(--muted)}.bar{height:6px;border-radius:5px;background:#2a3b53;margin-top:10px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#756cf7,#bdb3ff)}.callout{border-left:4px solid var(--gold);padding:13px 16px;background:#312c26;color:#ffe0ac;border-radius:0 10px 10px 0;font-size:15px}.pattern-table{font-size:14px}.pattern-table td{padding:9px 10px}.pattern-table th{padding:9px 10px}.page-no{position:absolute;right:65px;bottom:24px;color:#526981;font-size:12px;letter-spacing:.13em}
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script>
const d=window.BEATMAP_DETAILS, a=d.algorithms, s=a.Sunny, p=d.parsed, md=d.metadata;
const f=(v,n=2)=>v==null?'—':Number(v).toFixed(n), pct=v=>`${f(v*100,2)}%`;
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=(k,v)=>`<div class="row"><span class="key">${esc(k)}</span><span class="val">${esc(v)}</span></div>`;
const box=(title,body,note='')=>`<section class="section"><h2>${title}</h2>${body}${note?`<p class="note">${note}</p>`:''}</section>`;
const speedLabel=`${(d.conditions.mods||[]).join('+')||'自定义/无 Mod'} · ${Number(d.conditions.speedRate||1)}×`;
const footer=(n)=>`<div class="foot"><span>DATA / ${d.beatmapId??'LOCAL'}.json · ${speedLabel} · Stable / Classic${String(d.sourceId||'').startsWith('local-')?' · 本地谱面文件':''}</span><span>静态谱面分析 · 非实际游玩成绩</span></div><div class="page-no">BEATMAP DETAILS / ${n} OF 3</div>`;
function page(head,lead,body,n){return `<article class="page" id="page${n}"><div class="pagehead"><div><div class="eyebrow">OSU!MANIA / BEATMAP DETAIL</div><h1>${head}</h1><div class="sub">${esc(md.Artist)} · ${esc(md.Version)}</div></div><div class="serial">${d.beatmapId?'MAP #'+d.beatmapId:'LOCAL MAP'}<br><span class="tiny muted">${Number(md.BeatmapSetID)>0?'SET #'+esc(md.BeatmapSetID):'LOCAL SET'}</span></div></div><p class="lead">${lead}</p>${body}${footer(n)}</article>`}
function chart(id,title,caption,color='#66d7ff',tall=false){const axis=id==='density'?`时间 →　相对首物件 ${d.objectStats.firstStartMs} ms；每秒物件数`:'时间 →　分析器 graph.times 的谱面时间';return `<div class="chartwrap"><div class="charttitle"><strong>${title}</strong><span>${caption}</span></div><svg class="chart ${tall?'tall':''}" id="${id}" viewBox="0 0 1200 210" preserveAspectRatio="none"></svg><div class="axis-note">${axis}</div></div>`}
const conditions=d.conditions;
const cchips=Object.entries(conditions).map(([k,v])=>`<span class="chip ${v===true?'on':v===false?'off':''}">${esc(k)}: ${esc(Array.isArray(v)?v.length?'yes':'none':v)}</span>`).join('');
const metadata=box('谱面元数据 / Metadata',`<div class="grid2"><div>${row('Title',md.Title)}${row('TitleUnicode',md.TitleUnicode)}${row('Artist',md.Artist)}${row('ArtistUnicode',md.ArtistUnicode)}${row('Creator / Mapper',md.Creator)}${row('Version',md.Version)}</div><div>${row('Source',md.Source)}${row('BeatmapID',md.BeatmapID)}${row('BeatmapSetID',md.BeatmapSetID)}${row('gameMode',p.gameMode+' · osu!mania')}${row('OD',f(p.od,1))}${row('status',p.status)}</div></div><div class="spaced"><div class="key muted small">TAGS</div><div class="tagline" id="tags"></div></div>`);
const overviewKpi=`<div class="kpis"><div class="kpi"><div class="label">KEY COUNT</div><strong>${p.columnCount}K</strong></div><div class="kpi"><div class="label">OBJECTS</div><strong>${d.objectStats.noteStarts.toLocaleString()}</strong></div><div class="kpi"><div class="label">LN RATIO</div><strong class="accent">${pct(p.lnRatio)}</strong></div><div class="kpi"><div class="label">ACTIVE SPAN</div><strong>${f(d.patternReport.Duration/1000,2)}s</strong></div><div class="kpi"><div class="label">DENSITY PEAK</div><strong>${d.density.peak} <span class="small">NPS</span></strong></div></div>`;
const densityPanel=box('音符密度 / Density',chart('density','每秒物件起始数',`平均 ${f(d.density.mean,2)} NPS · 峰值 ${d.density.peak} NPS`,'#66d7ff',true),`真实 noteStarts；从首物件 ${d.objectStats.firstStartMs} ms 起，每 1000 ms 一个固定、不重叠的时间箱。每个物件起始计一次，长条尾不计；末箱可能不足 1 秒。与难度曲线的数值单位不同。`);
const curvePanel=box('分析器难度曲线 / Difficulty graph',`<div class="grid2">${chart('sunnyCurve','Sunny · 实际估算曲线',`${s.curve.sourcePoints.toLocaleString()} 原始点`,'#a899ff')}${chart('danielCurve','Daniel · 独立估算曲线',`${a.Daniel.curve.sourcePoints.toLocaleString()} 原始点`,'#ffcd74')}</div><div class="spaced">${chart('windowCurve','SunnyWindow / LN 曲线',`${d.sunnyWindowCurve.sourcePoints.toLocaleString()} 原始点`,'#ff7eb5')}</div>`,`折线由原始 graph.times / values 抽样绘制，保留局部极值；完整全部点见 ${d.beatmapId??'LOCAL'}.json。实际算法与回退情况见下一页。纵轴为算法难度值，不是 NPS。`);
const p1=page(esc(md.Title),'这是一张谱面静态分析图。图中所有估算星数、段位与 Rework PP 均来自分析器；玩家成绩、官方星数和官方 PP 没有在此推断。',overviewKpi+metadata+box('分析条件 / Run configuration',`<div class="chips">${cchips}</div>`,`MSD：MinaCalc 0.72.3；scoreGoal = 0.93。启用曲线、键型、MSD、Interlude、SunnyWindow 与 LN 分析。`)+densityPanel+curvePanel,1);
const algRows=Object.entries(a).map(([name,x])=>`<tr><td><b>${name}</b></td><td class="${name!==x.actualEstimatorAlgorithm?'warn':''}">${x.actualEstimatorAlgorithm}</td><td class="numeric highlight">${f(x.rework.star,3)}</td><td>${esc(x.rework.estDiff)}</td><td class="numeric">${esc(x.rework.numericDifficulty??x.rework.numericDifficultyHint??'—')}</td></tr>`).join('');
const algorithm=box('六种选择 / 实际执行算法',`<table><thead><tr><th>选择</th><th>实际</th><th class="numeric">估算星数</th><th>管线段位估计</th><th class="numeric">数值难度</th></tr></thead><tbody>${algRows}</tbody></table>`,`表格列出实际执行算法及回退状态；Mixed / Companella 基础管线结果与模型推理分别展示。`);
const comp=d.companella;
const compBox=box('Companella / 最终模型推理',`<div class="flex"><div><div class="metric" style="color:var(--pink)">${esc(comp.estDiff)}</div><div class="metric-label">估计段位 estDiff</div></div><div><div class="metric">${f(comp.numericDifficulty,2)}</div><div class="metric-label">numericDifficulty · danLabel ${esc(comp.danLabel)}</div></div><div><div class="metric">${f(comp.confidence,3)}</div><div class="metric-label">confidence · 模型内部量，非验证准确率</div></div></div><div class="grid2 spaced"><div>${row('rawModelOutput',f(comp.rawModelOutput,6))}${row('numericDifficultyHint',comp.numericDifficultyHint??'无')}${row('variant',comp.variant||'空')}</div><div>${row('Interlude 估算星数',f(d.interludeStar,6))}${row('Vibro 星数条件',f(d.vibro.star,6))}${row('Vibro eligible',String(d.vibro.eligible))}</div></div>`);
const w=d.sunnyWindow;
const wtypes=Array.isArray(w.typePercentageData)?w.typePercentageData:[];
const wrows=wtypes.length?wtypes.map(([name,n])=>`<tr><td>${name}</td><td class="numeric">${n.toLocaleString()}</td><td class="numeric">${pct(n/Math.max(1,wtypes[0][1]))}</td></tr>`).join(''):`<tr><td colspan="3" class="muted">${p.lnRatio===0?'本谱无长条，未返回 LN 分类数据':'分析器未返回 LN 分类数据'}</td></tr>`;
const windowBox=box('SunnyWindow / LN 识别',`<div class="grid2"><div>${row('star',f(w.star,6))}${row('lnStar',f(w.lnStar,6))}${row('lnRatio',f(w.lnRatio,6))}${row('columnCount',w.columnCount)}${row('estDiff',w.estDiff)}${row('numericDifficulty',w.numericDifficulty??'无')}${row('numericDifficultyHint',w.numericDifficultyHint??'无')}</div><div><table><thead><tr><th>分类</th><th class="numeric">计数</th><th class="numeric">占 All</th></tr></thead><tbody>${wrows}</tbody></table></div></div>`,`typePercentageData 的底层值是分类计数。HB 不是纯 LN 数量；LN 分类计数为 0 不表示谱面没有长条。`);
const e=d.ettResult;const msdOrder=['Overall','Stream','Jumpstream','Handstream','Stamina','JackSpeed','Chordjack','Technical']; const msdCards=msdOrder.map(name=>`<div class="barcard"><div class="lbl">${name}</div><div class="n">${f(e.values[name],2)}</div><div class="bar"><b style="width:${Math.min(100,e.values[name]/25*100)}%"></b></div></div>`).join('');
const msdBox=box('MinaCalc / MSD 八项',`<div class="bars">${msdCards}</div><div class="grid3 spaced"><div>${row('requestedEtternaVersion',e.requestedEtternaVersion)}${row('etternaVersion',e.etternaVersion)}${row('fallbackReason',e.etternaVersionFallbackReason??'无')}</div><div>${row('keycount',e.keycount)}${row('lnRatio',f(e.lnRatio,6))}${row('rowCount',e.rowCount)}</div><div>${row('engine',e.engine)}${row('junkFile',String(e.junkFile))}${row('scoreGoal','0.93')}</div></div>`,`八项为 Etterna MSD 指标，分数目标 0.93；并非官方 osu!mania 星数。`);
const p2=page('算法结果 / Difficulty analysis','难度估算按选择项与实际执行项同时展示；回退和模型后处理都明确标出。',algorithm+compBox+windowBox+msdBox,2);
const pp=d.ppMetrics, max=d.maxReworkPp;
const ppBox=box('Rework PP / 满判假设',`<div class="flex"><div><div class="metric" style="color:var(--gold)">${f(max.pp,2)} <span class="small">PP</span></div><div class="metric-label">Max Rework PP · 估算值</div></div><div><div class="metric">${pp.totalNotes.toLocaleString()}</div><div class="metric-label">perfect 假设；其他判定均为 0</div></div></div><div class="grid2 spaced"><div>${row('ppMetrics.star',f(pp.star,6))}${row('ppMetrics.variety',f(pp.variety,6))}${row('ppMetrics.accScalar',f(pp.accScalar,6))}${row('ppMetrics.totalNotes',pp.totalNotes)}${row('ppMetrics.spikiness',f(pp.spikiness,6))}${row('ppMetrics.switches',f(pp.switches,6))}</div><div>${row('maxReworkPp.v2Acc',f(max.v2Acc,6))}${row('maxReworkPp.proportion',f(max.proportion,6))}${row('accMultiplier',f(max.accMultiplier,6))}${row('varietyMultiplier',f(max.varietyMultiplier,6))}${row('lengthMultiplier',f(max.lengthMultiplier,6))}</div></div>`,`此值是分析器在全 PERFECT 假设下的 Rework PP，不是 osu! 官方 PP，也不是玩家实际 Live PP。`);
const r=d.patternReport; const pRows=r.Clusters.map((x,i)=>{let types=(x.SpecificTypes||[]).map(([n,v])=>`${n} ${pct(v)}`).join(' · ')||'—';return `<tr><td class="muted">${String(i+1).padStart(2,'0')}</td><td><b>${esc(x.Pattern)}</b></td><td>${esc(types)}</td><td class="numeric">${esc(x.BPM)}</td><td>${x.Mixed?'是':'否'}</td><td class="numeric">${Number(x.Amount).toLocaleString()}</td><td class="numeric">${f(x.RatingMultiplier,3)}</td></tr>`}).join('');
const pattern=box('完整键型簇 / All clusters',`<div class="grid3"><div>${row('Category',r.Category)}${row('ModeTag',r.ModeTag)}</div><div>${row('LNPercent',f(r.LNPercent,6))}${row('HBRowRatio',f(r.HBRowRatio,6))}</div><div>${row('SVAmount',r.SVAmount)}${row('Duration',`${r.Duration.toLocaleString()} ms`)}</div></div><table class="pattern-table spaced"><thead><tr><th>#</th><th>Pattern</th><th>子类及占比</th><th class="numeric">BPM</th><th>Mixed</th><th class="numeric">Amount</th><th class="numeric">倍率</th></tr></thead><tbody>${pRows}</tbody></table>`,`Amount 是算法权重或累计量，并非音符数量；没有子类的簇以“—”显示。`);
const stats=d.objectStats; const raw=box('原始解析数据 / 数据规模',`<div class="grid3"><div>${row('columns',stats.columns.toLocaleString())}${row('noteStarts',stats.noteStarts.toLocaleString())}${row('noteEnds',stats.noteEnds.toLocaleString())}${row('noteTypes',stats.noteTypes.toLocaleString())}</div><div>${row('objectIntervals',stats.objectIntervals.toLocaleString())}${row('noteType = 1',stats.noteTypeCounts['1']||0)}${row('noteType = 5',stats.noteTypeCounts['5']||0)}${row('noteType = 128',stats.noteTypeCounts['128']||0)}</div><div>${row('首物件',`${stats.firstStartMs} ms`)}${row('末物件起始',`${stats.lastStartMs} ms`)}${row('末物件尾',`${stats.lastEndMs} ms`)}${row('breaks',p.breaks.length?'有':'[] · 无')}</div></div>`,`逐物件数组均保存在原始 JSON 中；此页以统计和曲线呈现，不逐项展开全部物件。`);
const curves=box('曲线原始点数 / 数据索引',`<div class="grid2"><div>${Object.entries(a).map(([n,x])=>row(`${n}.graph.times / values`,x.curve.sourcePoints.toLocaleString())).join('')}</div><div>${row('SunnyWindow.graph.times / values',d.sunnyWindowCurve.sourcePoints.toLocaleString())}${row('Density bins',d.density.counts.length)}${row('6K 定数',d.sixKConst??'不适用 · 本谱非 6K')}${row('SunnyWindow LN 分析','已启用')}</div></div>`,`作图依据：${d.beatmapId??'LOCAL'}.json 原始曲线，经 build_data.py 保留局部极值缩减为显示折线。所有原始点仍在 JSON 内。`);
const noData=box('状态与数据边界',`<div class="grid2"><div><div class="callout">无实际游玩数据：Live PP、玩家准确率、六项判定、连击、游玩进度、暂停次数及暂停位置均无值。</div><div class="spaced">${row('patternError',d.diagnostics.patternError??'无')}${row('ettError',d.diagnostics.ettError??'无')}${row('ettErrorCode',d.diagnostics.ettErrorCode??'无')}</div></div><div>${row('interludeError',d.diagnostics.interludeError??'无')}${row('companellaEttError',d.diagnostics.companellaEttError??'无')}${row('errors',JSON.stringify(d.diagnostics.errors))}${row('Companella MSD 副结果',d.companellaEttResult?'有 · 见 JSON':'无 / 未单独返回')}</div></div>`,`空数值或不适用项以状态显示；非 6K 时不适用 sixKConst。没有数据的项目均以状态显示，不以 0 代替。`);
const p3=page('PP、键型与数据边界','完整列出键型簇、图表数据规模和无数据项目。',ppBox+pattern+raw+curves+noData,3);
document.getElementById('app').innerHTML=p1+p2+p3;
document.getElementById('tags').innerHTML=String(md.Tags||'').split(/\s+/).map(t=>`<span>${esc(t)}</span>`).join('');
function draw(svg,data,color,mode='line'){
 const W=1200,H=210,L=42,R=14,T=10,B=30, w=W-L-R,h=H-T-B;
 let vals=data.values||data.counts, times=data.times||vals.map((_,i)=>i);
 if(!vals.length)return;
 let x0=times[0],x1=times[times.length-1],max=Math.max(...vals),min=0;
 max=Math.max(max*1.07,1); const X=t=>L+(t-x0)/(x1-x0||1)*w,Y=v=>T+h-(v-min)/(max-min)*h;
 let grid='';for(let j=0;j<=4;j++){let y=T+h*j/4;grid+=`<line x1="${L}" y1="${y}" x2="${L+w}" y2="${y}" stroke="#304359" stroke-width="1"/><text x="${L-9}" y="${y+4}" fill="#8197b2" font-size="12" text-anchor="end">${Math.round(max*(1-j/4))}</text>`}
 for(let j=0;j<=4;j++){let x=L+w*j/4;grid+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${T+h}" stroke="#24364b" stroke-width="1"/>`}
 let path=vals.map((v,i)=>`${i?'L':'M'}${X(times[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('');
 const fill=`${path} L${X(times[times.length-1]).toFixed(1)},${T+h} L${L},${T+h} Z`;
 const endSeconds=svg.id==='density'?(data.lastMs-data.firstMs)/1000:(times[times.length-1]||0)/1000; const endLabel=`${Math.floor(endSeconds/60)}:${(endSeconds%60).toFixed(2).padStart(5,'0')}`;
 svg.innerHTML=`${grid}<path d="${fill}" fill="${color}" opacity=".15"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round"/><text x="${L}" y="${H-4}" fill="#93a7bc" font-size="13">0:00</text><text x="${L+w}" y="${H-4}" fill="#93a7bc" font-size="13" text-anchor="end">${endLabel}</text>`;
}
